# ============================================
# Test overrides for the integration tests (layered over application.properties)
# ============================================

# Poll quickly so a test does not wait a full minute for the first/next cycle
tms.poll.period=2000

# Keep test dead letters out of the application's data directory
dlq.directory=target/it/dlq

# Fail fast in tests; retry behaviour itself is configuration, not asserted here
error.maximum.redeliveries=0
