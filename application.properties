# ============================================
# Application Properties - TMS shipments <-> broker orders
# Runtime: Camel Main (JBang) 4.22.1
# ============================================

# --------------------------------------------
# SANDBOX CONNECTION (both flows)
# --------------------------------------------
sandbox.base.url=http://localhost:8000
sandbox.token.endpoint=http://localhost:8000/token
sandbox.oauth2.cache.tokens=true
sandbox.oauth2.body.authentication=true

# --------------------------------------------
# SECRETS - resolved from the OS environment, never stored here.
# An unset client id/secret fails startup with an unresolved-placeholder error; the inbound
# API key is resolved per request, so run.sh checks all three before launching.
# Required: SANDBOX_CLIENT_ID, SANDBOX_CLIENT_SECRET, SANDBOX_INBOUND_API_KEY
# --------------------------------------------
sandbox.client.id={{env:SANDBOX_CLIENT_ID}}
sandbox.client.secret={{env:SANDBOX_CLIENT_SECRET}}
sandbox.inbound.api.key={{env:SANDBOX_INBOUND_API_KEY}}

# --------------------------------------------
# FLOW: tms-shipment-to-broker-order
# --------------------------------------------
tms.poll.period=60000
tms.poll.limit=50
# Sending organisation's fixed identifier (not a credential, same for every customer)
broker.sender.id=KITT
broker.message.function.new=9

# --------------------------------------------
# FLOW: broker-event-to-tms-event
# --------------------------------------------
inbound.http.port=8080
inbound.http.path=/events

# platform-http listener (main runtime); must not bind 8000, which the sandbox occupies
camel.server.enabled=true
camel.server.port={{inbound.http.port}}
# The body is read before the API-key check; cap it (a 1000-event push is ~600 KB)
camel.server.maxBodySize=5242880

# Mask sensitive values (passwords, secrets, tokens) in Camel log output
camel.main.logMask=true
# The startup property summary prints sandbox.client.id in clear (logMask only masks secret-like keys)
camel.main.autoConfigurationLogSummary=false

# --------------------------------------------
# ERROR HANDLING (both flows)
# --------------------------------------------
error.maximum.redeliveries=3
error.redelivery.delay=1000
error.backoff.multiplier=2
dlq.directory=data/dlq

# --------------------------------------------
# MAIN RUNTIME DEPENDENCIES
# camel-groovy must be present at launch so the *.groovy beans are precompiled
# --------------------------------------------
camel.jbang.dependencies=org.apache.camel:camel-timer:4.22.1,org.apache.camel:camel-http:4.22.1,org.apache.camel:camel-platform-http:4.22.1,org.apache.camel:camel-platform-http-main:4.22.1,org.apache.camel:camel-seda:4.22.1,org.apache.camel:camel-file:4.22.1,org.apache.camel:camel-jackson:4.22.1,org.apache.camel:camel-groovy:4.22.1
